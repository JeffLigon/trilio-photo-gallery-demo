# Stable 1.0 branch used docker.io/jeffligon/trilio-photo-gallery-demo:v1.5
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trilio-gallery-frontend
  namespace: trilio-demo
  labels:
    app: trilio-gallery
    tier: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: trilio-gallery
      tier: frontend
  template:
    metadata:
      labels:
        app: trilio-gallery
        tier: frontend
    spec:
      # restricted‑v2 friendly
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-pv-claim
        - name: sql-drop
          emptyDir: {}
        

      initContainers:
      # Copy schema.sql and seed.sql out of the app image into a shared emptyDir
        - name: copy-sql
          image: docker.io/jeffligon/trilio-photo-gallery-demo:v1.10
          imagePullPolicy: Always
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu
              mkdir -p /db
              cp -v /app/db/schema.sql /db/schema.sql
              cp -v /app/db/seed.sql   /db/seed.sql
              ls -l /db || true
          volumeMounts:
            - name: sql-drop
              mountPath: /db

        # Copies baked media into PVC (no chmod needed)
        - name: seed-media
          image: docker.io/jeffligon/trilio-photo-gallery-demo:v1.10
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -e
              echo "$(date -Is) [seed-media] start"
              umask 0000
              [ -d /data/media ] || install -d -m 0777 /data/media

              before=$(ls -1 /data/media 2>/dev/null | wc -l || echo 0)
              if [ -d /app/public/media ]; then
                cp -nv /app/public/media/* /data/media/ || true
              fi
              # keep seed svgs as last resort
              cp -nv /app/public/seed-*.svg /data/media/ 2>/dev/null || true
              after=$(ls -1 /data/media 2>/dev/null | wc -l || echo 0)
              echo "$(date -Is) [seed-media] done (files_before=$before, files_after=$after)"
          volumeMounts:
            - name: media
              mountPath: /data/media

        # Applies schema.sql + seed.sql using a MySQL 8–capable client
        - name: seed-db
          image: docker.io/bitnami/mysql:8.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh","-lc"]   
          env:
            - name: MYSQL_HOST
              value: trilio-gallery-mysql
            - name: MYSQL_USER
              value: root
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-pass
                  key: password
            # Default: keep user-added rows. Set to "true" to wipe table before seeding.
            - name: RESET_SEED
              value: "false"
          volumeMounts:
            - name: sql-drop
              mountPath: /db
              readOnly: true
          args:
            - |
              set -eu
              export PATH="/opt/bitnami/mysql/bin:$PATH"   # <— add this line
              echo "[seed-db] start"
              command -v mysql && mysql --version || true
              test -f /db/schema.sql && test -f /db/seed.sql

              # Guard against old seed content
              if grep -qE 'seed-.*\.svg' /db/seed.sql; then
                echo "[seed-db] ERROR: /db/seed.sql contains seed-*.svg"; exit 1
              fi

              # Wait for MySQL
              until mysql -h "$MYSQL_HOST" -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" -e "SELECT 1" >/dev/null 2>&1; do
                echo "[seed-db] waiting for MySQL..."; sleep 3
              done

              # DB - Apply/refresh schema (idempotent)
              mysql -h "$MYSQL_HOST" -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" -e "CREATE DATABASE IF NOT EXISTS triliogallery;"
              mysql -h "$MYSQL_HOST" -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" -D triliogallery < /db/schema.sql
              # Optional reset (only if explicitly requested)
               if [ "${RESET_SEED:-false}" = "true" ]; then
                 echo "[seed-db] RESET_SEED=true: truncating photos table..."
                 mysql -h "$MYSQL_HOST" -uroot -p"$MYSQL_ROOT_PASSWORD" -D triliogallery -e "TRUNCATE TABLE photos;"
               else
                 echo "[seed-db] additive seed: keeping existing rows"
               fi
              
              # Seed rows (should use UPSERTs in /db/seed.sql)
              mysql -h "$MYSQL_HOST" -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" -D triliogallery < /db/seed.sql

              # Validate
              mysql -h "$MYSQL_HOST" -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" -D triliogallery -e "
                SELECT COUNT(*) AS rows_, ROUND(SUM(size_bytes)/1048576,2) AS total_MB FROM photos;
              "
              echo "[seed-db] done"
        
        # NEW: reconcile any files that exist on the media PVC but are missing in DB
        - name: reconcile-media-to-db
          image: bitnami/mysql:8.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-pass
                  key: password
            - name: MYSQL_HOST
              value: trilio-gallery-mysql
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu
              export PATH="/opt/bitnami/mysql/bin:$PATH"
              # wait for DB
              until mysql -h "$MYSQL_HOST" -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1" >/dev/null 2>&1; do
                echo "[reconcile] waiting for MySQL..."; sleep 2
              done
              # walk media dir and upsert any missing rows
              shopt -s nullglob || true 2>/dev/null || true
              for f in /data/media/*.jpg /data/media/*.jpeg; do
                [ -f "$f" ] || continue
                base="$(basename "$f")"
                # portable size (works on busybox/ubI): 
                size="$(wc -c < "$f" | tr -d ' ')"
                # human-ish title from filename
                title="$(printf "%s" "$base" | sed -E 's/\.(jpe?g)$//; s/[-_]+/ /g; s/\b(.)/\U\1/g')"
                mysql -h "$MYSQL_HOST" -uroot -p"$MYSQL_ROOT_PASSWORD" -D triliogallery -e "
                  INSERT INTO photos (filename,title,caption,size_bytes)
                  VALUES ('$base','$title','', $size)
                  ON DUPLICATE KEY UPDATE
                    size_bytes=VALUES(size_bytes);"
                echo "[reconcile] ensured $base ($size bytes)"
              done
          volumeMounts:
            - name: media
              mountPath: /data/media

      containers:
        - name: web
          image: docker.io/jeffligon/trilio-photo-gallery-demo:v1.10
          imagePullPolicy: Always

          # Start app normally (no debug wrapper)
          command: ["node"]
          args: ["server.js"]

          env:
            - name: NODE_ENV
              value: "production"
            - name: NODE_OPTIONS
              value: "--trace-warnings"

            # Explicit port to avoid framework defaults
            - name: PORT
              value: "8080"

            # App configuration (same as before)
            - name: DB_HOST
              value: trilio-gallery-mysql
            - name: DB_USER
              value: root
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: mysql-pass
                  key: password
            - name: DB_NAME
              value: triliogallery
            - name: MEDIA_DIR
              value: /data/media

          ports:
            - name: http
              containerPort: 8080

          # Resource requests / limits
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

          # readinessProbe: {}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          
          # livenessProbe: {}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
    
          # OpenShift restricted‑v2 compliant; do NOT set fsGroup or runAsUser
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault

          volumeMounts:
            - name: media
              mountPath: /data/media

---
apiVersion: v1
kind: Service
metadata:
  name: trilio-gallery-frontend
  namespace: trilio-demo
  labels:
    app: trilio-gallery
    tier: frontend
spec:
  selector:
    app: trilio-gallery
    tier: frontend
  ports:
    - name: http
      port: 80          # external service port (what the Route uses)
      targetPort: 8080  # containerPort in your pod
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: trilio-gallery-frontend
  namespace: trilio-demo
spec:
  to:
    kind: Service
    name: trilio-gallery-frontend
    weight: 100
  port:
    targetPort: http    # <— matches the Service port name above
  wildcardPolicy: None
