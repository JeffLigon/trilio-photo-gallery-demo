apiVersion: apps/v1
kind: Deployment
metadata:
  name: trilio-gallery-frontend
  namespace: trilio-demo
  labels:
    app: trilio-gallery
    tier: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: trilio-gallery
      tier: frontend
  template:
    metadata:
      labels:
        app: trilio-gallery
        tier: frontend
    spec:
      # restricted‑v2 friendly
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-pv-claim
        - name: sql
          configMap:
            name: trilio-gallery-sql

      initContainers:
        # Copies baked media into PVC (no chmod needed)
        - name: seed-media
          image: docker.io/jeffligon/trilio-photo-gallery-demo:v1.4
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -e
              echo "$(date -Is) [seed-media] start"
              umask 0000
              [ -d /data/media ] || install -d -m 0777 /data/media

              before=$(ls -1 /data/media 2>/dev/null | wc -l || echo 0)
              if [ -d /app/public/media ]; then
                cp -nv /app/public/media/* /data/media/ || true
              fi
              # keep seed svgs as last resort
              cp -nv /app/public/seed-*.svg /data/media/ 2>/dev/null || true
              after=$(ls -1 /data/media 2>/dev/null | wc -l || echo 0)
              echo "$(date -Is) [seed-media] done (files_before=$before, files_after=$after)"
          volumeMounts:
            - name: media
              mountPath: /data/media

        # Applies schema.sql + seed.sql using a MySQL 8–capable client
        - name: seed-db
          image: bitnami/mysql:8.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          env:
            - name: MYSQL_HOST
              value: trilio-gallery-mysql
            - name: MYSQL_USER
              value: root
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-pass
                  key: password
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -e
              export PATH="/opt/bitnami/mysql/bin:$PATH"
              echo "$(date -Is) [seed-db] start"
              echo "$(date -Is) [seed-db] mysql in PATH?"; command -v mysql || true
              echo "$(date -Is) [seed-db] mysql --version:"; mysql --version || true
              echo "$(date -Is) [seed-db] DNS check:"; getent hosts "$MYSQL_HOST" || true

              i=0
              until mysql -h "$MYSQL_HOST" -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" -e "SELECT 1" >/dev/null 2> /tmp/mysql.err; do
                i=$((i+1))
                if [ $i -eq 1 ] || [ $((i%5)) -eq 0 ]; then
                  echo "$(date -Is) [seed-db] still waiting on MySQL… attempt=$i"
                  echo "----- mysql stderr -----"; cat /tmp/mysql.err || true; echo "------------------------"
                fi
                if [ $i -ge 48 ]; then
                  echo "$(date -Is) [seed-db] timeout waiting for MySQL"
                  echo "Last error:"; cat /tmp/mysql.err || true
                  exit 1
                fi
                sleep 5
              done

              # Ensure DB exists
              mysql -h "$MYSQL_HOST" -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" -e 'CREATE DATABASE IF NOT EXISTS `triliogallery`;'

              # Apply schema/seed explicitly *to* triliogallery
              echo "$(date -Is) [seed-db] applying schema.sql"
              mysql -h "$MYSQL_HOST" -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" -D triliogallery < /db/schema.sql
              echo "$(date -Is) [seed-db] applying seed.sql"
              mysql -h "$MYSQL_HOST" -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" -D triliogallery < /db/seed.sql
              echo "$(date -Is) [seed-db] done"
          volumeMounts:
            - name: sql
              mountPath: /db

      containers:
        - name: web
          image: docker.io/jeffligon/trilio-photo-gallery-demo:v1.4
          imagePullPolicy: Always

          # Start app normally (no debug wrapper)
          command: ["node"]
          args: ["server.js"]

          env:
            - name: NODE_ENV
              value: "production"
            - name: NODE_OPTIONS
              value: "--trace-warnings"

            # Explicit port to avoid framework defaults
            - name: PORT
              value: "8080"

            # App configuration (same as before)
            - name: DB_HOST
              value: trilio-gallery-mysql
            - name: DB_USER
              value: root
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: mysql-pass
                  key: password
            - name: DB_NAME
              value: triliogallery
            - name: MEDIA_DIR
              value: /data/media

          ports:
            - name: http
              containerPort: 8080

          # Resource requests / limits
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

          # readinessProbe: {}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          
          # livenessProbe: {}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
    
          # OpenShift restricted‑v2 compliant; do NOT set fsGroup or runAsUser
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault

          volumeMounts:
            - name: media
              mountPath: /data/media

---
apiVersion: v1
kind: Service
metadata:
  name: trilio-gallery-frontend
  namespace: trilio-demo
  labels:
    app: trilio-gallery
    tier: frontend
spec:
  selector:
    app: trilio-gallery
    tier: frontend
  ports:
    - name: http
      port: 80          # external service port (what the Route uses)
      targetPort: 8080  # containerPort in your pod
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: trilio-gallery-frontend
  namespace: trilio-demo
spec:
  to:
    kind: Service
    name: trilio-gallery-frontend
    weight: 100
  port:
    targetPort: http    # <— matches the Service port name above
  wildcardPolicy: None
