apiVersion: apps/v1
kind: Deployment
metadata:
  name: trilio-gallery-frontend
  namespace: trilio-demo
  labels:
    app: trilio-gallery
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trilio-gallery
      tier: frontend
  template:
    metadata:
      labels:
        app: trilio-gallery
        tier: frontend
    spec:
      # Pod-level security (restricted-v2 friendly)
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-pv-claim
        - name: sql
          configMap:
            name: trilio-gallery-sql

      initContainers:
        # 1) Copy baked media to PVC (no overwrite). No chmod needed.
        - name: seed-media
          image: docker.io/jeffligon/trilio-photo-gallery-demo:v1.2
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -e
              echo "$(date -Is) [seed-media] start"
              umask 0000
              if [ ! -d /data/media ]; then
                install -d -m 0777 /data/media || { echo "[seed-media] cannot create /data/media"; exit 1; }
              fi
              if [ -d /app/public/media ]; then
                cp -nv /app/public/media/* /data/media/ || true
              fi
              cp -nv /app/public/seed-*.svg /data/media/ 2>/dev/null || true
              echo "$(date -Is) [seed-media] done"
          volumeMounts:
            - name: media
              mountPath: /data/media

        # 2) Apply schema.sql + seed.sql using a MySQL 8-capable client image
        - name: seed-db
          image: bitnami/mysql:8.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          env:
            - name: MYSQL_HOST
              value: trilio-gallery-mysql
            - name: MYSQL_USER
              value: root
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-pass
                  key: password
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -e
              export PATH="/opt/bitnami/mysql/bin:$PATH"
              echo "$(date -Is) [seed-db] start"
              echo "$(date -Is) [seed-db] mysql in PATH?"; command -v mysql || true
              echo "$(date -Is) [seed-db] mysql --version:"; mysql --version || true
              echo "$(date -Is) [seed-db] DNS check:"; getent hosts "$MYSQL_HOST" || true

              i=0
              until mysql -h "$MYSQL_HOST" -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" -e "SELECT 1" >/dev/null 2> /tmp/mysql.err; do
                i=$((i+1))
                if [ $i -eq 1 ] || [ $((i%5)) -eq 0 ]; then
                  echo "$(date -Is) [seed-db] still waiting on MySQL… attempt=$i"
                  echo "----- mysql stderr -----"; cat /tmp/mysql.err || true; echo "------------------------"
                fi
                if [ $i -ge 48 ]; then
                  echo "$(date -Is) [seed-db] timeout waiting for MySQL"
                  echo "Last error:"; cat /tmp/mysql.err || true
                  exit 1
                fi
                sleep 5
              done

              echo "$(date -Is) [seed-db] applying schema.sql"
              mysql -h "$MYSQL_HOST" -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" < /db/schema.sql
              echo "$(date -Is) [seed-db] applying seed.sql"
              mysql -h "$MYSQL_HOST" -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" < /db/seed.sql
              echo "$(date -Is) [seed-db] done"
          volumeMounts:
            - name: sql
              mountPath: /db

      containers:
        - name: web
          image: docker.io/jeffligon/trilio-photo-gallery-demo:v1.2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              value: trilio-gallery-mysql
            - name: DB_USER
              value: root
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: mysql-pass
                  key: password
            - name: DB_NAME
              value: triliogallery
            - name: MEDIA_DIR
              value: /data/media
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - name: media
              mountPath: /data/media
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
